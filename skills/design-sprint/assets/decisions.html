<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Design sprint</title>
<style>
	:root {
		color-scheme: light dark;
		--bg: #f6f7f8; --panel: #ffffff; --line: #d9dde1; --ink: #16191d; --muted: #5b636c;
		--accent: #0f6b62; --accent-ink: #ffffff; --warn: #8a4b00; --radius: 6px;
		font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
	}
	@media (prefers-color-scheme: dark) {
		:root { --bg: #111417; --panel: #1a1f23; --line: #2e353b; --ink: #e8ecef; --muted: #9aa4ad; --accent: #3fb8a9; --accent-ink: #0b1513; --warn: #f0b35a; }
	}
	* { box-sizing: border-box; }
	html, body { height: 100%; }
	body { margin: 0; background: var(--bg); color: var(--ink); overflow-wrap: anywhere; display: flex; flex-direction: column; overflow: hidden; }
	header { flex: none; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; display: grid; gap: 8px; }
	main { flex: 1; min-height: 0; overflow: auto; }
	.content { padding: 16px 16px 28px; display: grid; gap: 20px; max-width: 1600px; margin: 0 auto; }
	footer { flex: none; z-index: 2; background: var(--panel); border-top: 1px solid var(--line); padding: 10px 16px; }
	[hidden] { display: none !important; }
	h1 { font-size: 18px; margin: 0; }
	h2 { font-size: 17px; margin: 0; }
	h3 { font-size: 15px; margin: 0; }
	p { margin: 0; }
	.muted { color: var(--muted); }
	.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
	.spacer { flex: 1; }
	button, select, textarea, input { font: inherit; color: inherit; }
	button { border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); padding: 6px 10px; cursor: pointer; }
	button:hover { border-color: var(--muted); }
	button.primary, button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
	button:disabled { opacity: 0.45; cursor: not-allowed; }
	button:focus-visible, a:focus-visible, textarea:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
	select, textarea { border: 1px solid var(--line); background: var(--bg); border-radius: var(--radius); padding: 6px 8px; max-width: 100%; }
	textarea { width: 100%; min-height: 56px; resize: vertical; }
	a { color: var(--accent); }
	#goal { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
	.presence::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; background: currentColor; vertical-align: 1px; }
	.presence.listening { color: var(--accent); }
	.presence.working, .presence.stalled { color: var(--warn); }
	.presence.working::before { animation: pulse 1.2s ease-in-out infinite; }
	@keyframes pulse { 50% { opacity: 0.3; } }
	@media (prefers-reduced-motion: reduce) { .presence.working::before { animation: none; } }
	.agent-line { border-left: 3px solid var(--accent); padding: 2px 0 2px 10px; }
	#agent-message { flex: 1; min-width: 12ch; }
	.stepper { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
	.chip { flex: none; white-space: nowrap; }
	.chip[aria-current="step"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
	.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); }
	.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: grid; gap: 10px; align-content: start; min-width: 0; }
	.card.picked { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
	.tag { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; color: var(--muted); }
	.tag.rec, .tag.new { border-color: var(--accent); color: var(--accent); }
	.preview { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); }
	.preview iframe { border: 0; transform-origin: 0 0; position: absolute; top: 0; left: 0; background: transparent; }
	.preview img { display: block; width: 100%; height: 100%; object-fit: contain; object-position: top; }
	.preview .empty { display: grid; place-items: center; height: 100%; padding: 16px; text-align: center; color: var(--muted); }
	details summary { cursor: pointer; color: var(--muted); }
	details[open] > summary { margin-bottom: 8px; }
	fieldset { border: 1px solid var(--line); border-radius: var(--radius); display: grid; gap: 8px; padding: 12px; margin: 0; }
	.choice { display: flex; gap: 8px; align-items: flex-start; }
	.thread { display: grid; gap: 10px; }
	.request { display: grid; gap: 6px; border-left: 3px solid var(--line); padding: 6px 0 6px 12px; }
	.request-text, .agent-note { white-space: pre-wrap; }
	.agent-response { display: grid; gap: 4px; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); }
	.agent-response.working { border-color: var(--warn); }
	.question { display: grid; gap: 8px; padding: 10px; border: 1px solid var(--accent); border-radius: var(--radius); background: var(--panel); }
	.question.answered { border-color: var(--line); }
	#step > section { display: grid; gap: 12px; align-content: start; }
	.review-list { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
	.review-list li.missing { color: var(--warn); }
	.lanes { margin: 0; padding-left: 20px; }
	.notice { border: 1px solid var(--warn); color: var(--warn); border-radius: var(--radius); padding: 8px 12px; margin: 12px 16px 0; flex: none; }
	@media (max-width: 600px) {
		header, footer, .content { padding-left: 12px; padding-right: 12px; }
		header { gap: 6px; padding-top: 8px; padding-bottom: 8px; }
		header button, footer button { padding: 4px 8px; }
		#goal { display: none; }
		h1 { font-size: 16px; }
	}
</style>
</head>
<body>
<header>
	<div class="row" id="top"></div>
	<p id="goal" class="muted"></p>
	<p id="presence" class="presence"></p>
	<div id="agent-line" class="row agent-line" role="status" aria-live="polite" hidden>
		<span id="agent-message"></span>
		<button type="button" id="agent-show">Show</button>
	</div>
	<nav id="stepper" class="stepper" aria-label="Steps"></nav>
	<p id="send-status" class="muted" role="status"></p>
</header>
<div class="notice" id="offline" hidden>The sprint server is not reachable. Your picks are kept in this browser; use Copy answer and paste it to the agent.</div>
<main id="main">
	<div class="content">
		<section id="asks" aria-labelledby="asks-title" hidden></section>
		<div id="step"></div>
	</div>
</main>
<footer id="footer" hidden></footer>
<script>
const KEEP = 'keep';
const STATUS_WORDS = { sent: 'Sent', received: 'Received by the agent', working: 'Working', done: 'Done', declined: 'Declined' };
const state = { sprint: null, feedback: [], agent: null, filesOrigin: null, viewport: 1280, theme: null, phase: 'building', stepId: null, signatures: {}, stopped: false, busy: false };
const picks = {};
const sentPicks = {};
const drafts = {};
const choices = {};
const observers = new Map();

const $ = (id) => document.getElementById(id);
function el(tag, props = {}, children = []) {
	const node = document.createElement(tag);
	for (const [key, value] of Object.entries(props)) {
		if (value == null) continue;
		if (key === 'dataset') Object.assign(node.dataset, value);
		else if (key === 'role' || key.startsWith('aria')) node.setAttribute(key.replace(/[A-Z]/g, (letter) => `-${letter.toLowerCase()}`), value);
		else node[key] = value;
	}
	for (const child of [].concat(children)) if (child != null && child !== false) node.append(child);
	return node;
}
const domId = (key) => `field-${String(key).replace(/[^A-Za-z0-9_-]/g, '_')}`;
const clip = (text, max) => (text.length > max ? `${text.slice(0, max - 1)}…` : text);
function hashId() { try { return decodeURIComponent(location.hash.slice(1)); } catch { return ''; } }
const toHash = (id) => `#${encodeURIComponent(id).replace(/%3A/gi, ':')}`;
const storageKey = () => `design-sprint:${state.sprintId}`;
function loadPicks() { try { return JSON.parse(localStorage.getItem(storageKey())) ?? {}; } catch { return {}; } }
function savePicks() { try { localStorage.setItem(storageKey(), JSON.stringify(picks)); } catch { /* storage can be blocked */ } }
function setStatus(text) { $('send-status').textContent = text; }

const liveVariants = (sprint) => (sprint.variants ?? []).filter((variant) => !variant.retired);
const hasSubmit = () => state.feedback.some((event) => event.type === 'submit');
function phaseOf(sprint, feedback) {
	if (sprint.done) return 'done';
	if (feedback.some((event) => event.type === 'submit')) return 'wrap-up';
	return liveVariants(sprint).length ? 'choosing' : 'building';
}
function keepLabel(kind) {
	if (kind === 'direction') return state.sprint.mode === 'new-feature' ? "Don't add it" : 'Do nothing: keep the current screen';
	return 'Do nothing: keep today’s behaviour';
}
// "Do nothing" is always available: the manifest's own keep option wins, otherwise one is added.
function withKeep(options, label, current) {
	if (options.some((option) => option.keep)) return options;
	return [...options, { id: KEEP, keep: true, label, note: current?.note ?? 'No change: keep what exists today.', url: current?.url, image: current?.image, height: current?.height }];
}
const optionValue = (decision, option) => (option.keep ? `${decision.id}-keep` : option.id);
function activeDecisions(sprint, chosen) {
	if (sprint.mode !== 'new-feature') return sprint.decisions ?? [];
	if (!chosen.direction || chosen.direction === KEEP) return [];
	return (sprint.decisions ?? []).filter((decision) => decision.basedOn === chosen.direction);
}
function stepsOf(sprint, chosen) {
	const steps = [{ id: 'direction', kind: 'direction', title: 'Direction' }];
	const decisions = activeDecisions(sprint, chosen);
	const picked = liveVariants(sprint).find((variant) => variant.id === chosen.direction);
	if (sprint.mode === 'new-feature' && picked && !picked.noDecisions && !decisions.length) {
		steps.push({ id: 'waiting', kind: 'waiting', title: 'Decisions', variantId: chosen.direction });
	} else {
		for (const decision of decisions) steps.push({ id: `decision:${decision.id}`, kind: 'decision', title: clip(decision.question || `Decision ${decision.id}`, 40), decision });
	}
	steps.push({ id: 'review', kind: 'review', title: 'Review' });
	return steps;
}
const currentSteps = () => (state.phase === 'choosing' ? stepsOf(state.sprint, picks) : []);
const currentStep = () => currentSteps().find((step) => step.id === state.stepId) ?? null;
const pickTarget = (step) => (step.kind === 'direction' ? 'direction' : step.kind === 'decision' ? step.id : null);

// Picks of retired variants or removed options are dropped, so the answer only names what is on the page.
function reconcilePicks() {
	const valid = new Map([['direction', new Set(withKeep(liveVariants(state.sprint), '', state.sprint.current).map((variant) => (variant.keep ? KEEP : variant.id)))]]);
	for (const decision of activeDecisions(state.sprint, picks)) valid.set(`decision:${decision.id}`, new Set(withKeep(decision.options ?? [], '', decision.current).map((option) => optionValue(decision, option))));
	let changed = false;
	for (const [target, value] of Object.entries(picks)) {
		if (!valid.get(target)?.has(value)) { delete picks[target]; changed = true; }
	}
	if (changed) savePicks();
}
function answerText() {
	const parts = [];
	if (picks.direction) parts.push(picks.direction === KEEP ? 'Direction: keep current' : `Direction ${picks.direction}`);
	for (const decision of activeDecisions(state.sprint, picks)) {
		const pick = picks[`decision:${decision.id}`];
		if (pick) parts.push(pick.endsWith('-keep') ? `${decision.id}: keep` : pick);
	}
	return parts.join(', ');
}
function pickLabel(step, value) {
	if (!value) return '';
	if (value === KEEP || value.endsWith('-keep')) return step.kind === 'direction' && state.sprint.mode === 'new-feature' ? "don't add it" : 'keep';
	return value;
}

const received = (event) => {
	const index = state.feedback.findIndex((item) => item.id === event.id);
	return index > -1 && index < (state.agent?.seen ?? 0);
};
const deliveryWord = (event) => (received(event) ? 'Received by the agent' : 'Sent');
function answerOf(question) { return state.feedback.findLast((event) => event.type === 'answer' && event.target === `question:${question.id}`) ?? null; }
const questions = () => (state.sprint.questions ?? []).filter((question) => question?.id);
const withSubmitQuestions = () => questions().filter((question) => question.withSubmit);
const askedQuestions = () => questions().filter((question) => !question.withSubmit);
const openQuestions = () => askedQuestions().filter((question) => !answerOf(question));
function targetLabel(target) {
	if (target === 'direction') return 'a new direction';
	if (target === 'sprint') return 'your general request';
	return target.replace(':', ' ');
}
function threadTargets() {
	const targets = new Set(['direction', 'sprint', ...liveVariants(state.sprint).map((variant) => `variant:${variant.id}`)]);
	for (const decision of activeDecisions(state.sprint, picks)) targets.add(`decision:${decision.id}`);
	return targets;
}
function stepForTarget(target) {
	if (target === 'direction' || target.startsWith('variant:')) return threadTargets().has(target) ? 'direction' : 'review';
	if (target.startsWith('decision:') && threadTargets().has(target)) return target;
	return 'review';
}
function requestItems() {
	const byId = new Map((state.sprint.requests ?? []).map((request) => [request.feedbackId, request]));
	return state.feedback.filter((event) => event.type === 'reprompt').map((event) => {
		const request = byId.get(event.id);
		const status = ['working', 'done', 'declined'].includes(request?.status) ? request.status : received(event) ? 'received' : 'sent';
		return { event, status, note: request?.note ?? '', questions: askedQuestions().filter((question) => question.about === event.id) };
	});
}
function urgentItem(items) {
	const open = openQuestions();
	const unfinished = items.filter((item) => ['sent', 'received', 'working'].includes(item.status));
	const others = (count) => (count > 0 ? ` ${count} other ${count === 1 ? 'thing is' : 'things are'} still open.` : '');
	if (open.length) {
		const question = open[0];
		const about = items.find((item) => item.event.id === question.about);
		return {
			text: `The agent asks${about ? ` about ${targetLabel(about.event.target)}` : ''}: ${question.text}${others(open.length - 1 + unfinished.filter((item) => item !== about).length)}`,
			action: 'Reply', stepId: about ? stepForTarget(about.event.target) : null, nodeId: `question-${question.id}`,
		};
	}
	const reportable = state.phase === 'choosing' ? items : unfinished;
	const item = unfinished.findLast((candidate) => candidate.status === 'working') ?? reportable.at(-1);
	if (!item) return null;
	const target = targetLabel(item.event.target);
	const lead = { sent: `Your request about ${target} is sent`, received: `The agent has your request about ${target}`, working: `Working on ${target}`, done: `Done with ${target}`, declined: `The agent declined ${target}` }[item.status];
	return {
		text: `${lead}${item.note ? `: ${item.note}` : '.'}${others(unfinished.filter((other) => other !== item).length)}`,
		action: 'Show', stepId: stepForTarget(item.event.target), nodeId: `request-${item.event.id}`,
	};
}

function questionComplete(question) {
	if (question.options?.length && choices[question.id]) return true;
	return Boolean((question.allowText || !question.options?.length) && (drafts[`answer:${question.id}`] ?? '').trim());
}
function canSubmit() {
	if (state.phase !== 'choosing') return false;
	const steps = currentSteps().filter((step) => step.kind !== 'review');
	return steps.every((step) => step.kind !== 'waiting' && picks[pickTarget(step)]) && withSubmitQuestions().every(questionComplete);
}

function elapsed(since) {
	const minutes = Math.floor((Date.now() - Date.parse(since)) / 60000);
	if (!Number.isFinite(minutes) || minutes < 1) return '';
	return minutes < 60 ? ` (${minutes} min)` : ` (${Math.floor(minutes / 60)} h ${minutes % 60} min)`;
}
function buildingText() {
	const running = state.agent?.building?.running ?? [];
	if (!running.length) return '';
	return running.length === 1 ? ` Building variant ${running[0]}.` : ` Building variants ${running.join(', ')}.`;
}
function presenceText() {
	const agent = state.agent;
	if (!agent) return '';
	if (agent.state === 'listening') return `The agent is listening.${buildingText()}`;
	if (agent.state === 'working') return `${state.sprint.status?.message?.trim() || 'Working on your last input.'}${agent.since ? elapsed(agent.since) : ''}${buildingText()}`;
	return 'No activity from the agent for 10 minutes. Check its terminal.';
}

function fill(template) {
	return template.replaceAll('{theme}', encodeURIComponent(state.theme ?? '')).replaceAll('{width}', String(state.viewport));
}
// Previews may only load http(s) URLs; anything else (javascript:, data:, file:) is refused. A path without
// a scheme names a file in the sprint directory, served from the separate preview origin.
function safeUrl(raw) {
	try {
		const filled = fill(raw);
		const isSprintFile = !/^[a-z][a-z0-9+.-]*:/i.test(filled) && !filled.startsWith('//');
		if (isSprintFile && !state.filesOrigin) return null;
		const url = isSprintFile ? new URL(`/files/${filled.replace(/^\/?(files\/)?/, '')}`, state.filesOrigin) : new URL(filled);
		return url.protocol === 'http:' || url.protocol === 'https:' ? url : null;
	} catch {
		return null;
	}
}
function previewFor(item, height) {
	const box = el('div', { className: 'preview' });
	box.style.height = `${item.height ?? height}px`;
	const url = item.url ? safeUrl(item.url) : null;
	if (url) {
		const frame = el('iframe', { title: item.label ? `Preview: ${item.label}` : 'Preview', loading: 'lazy' });
		// Previews never share this page's origin; one that does anyway gets an opaque origin.
		frame.setAttribute('sandbox', url.origin === location.origin ? 'allow-scripts allow-forms' : 'allow-scripts allow-forms allow-same-origin');
		frame.src = url.href;
		box.append(frame);
		const fit = () => {
			const scale = Math.min(1, box.clientWidth / state.viewport);
			frame.style.width = `${state.viewport}px`;
			frame.style.height = `${box.clientHeight / Math.max(scale, 0.01)}px`;
			frame.style.transform = `scale(${scale})`;
		};
		const observer = new ResizeObserver(fit);
		observer.observe(box);
		observers.set(box, observer);
	} else if (item.image && safeUrl(item.image)) {
		box.append(el('img', { src: safeUrl(item.image).href, alt: item.label || 'Preview' }));
	} else {
		const refused = (item.url || item.image) && !url;
		box.append(el('div', { className: 'empty', textContent: refused ? 'Preview URL refused: only http(s) and relative URLs load.' : item.keep ? 'Keep today’s version' : 'No preview' }));
	}
	return box;
}
// Blind sprints hide which model made each variant until the user submits.
const visibleModel = (model) => (model && !(state.sprint.blind && !hasSubmit()) ? model : null);

function renderWhenChanged(region, signature, build) {
	const key = JSON.stringify(signature);
	if (state.signatures[region] === key) return;
	state.signatures[region] = key;
	build();
}
function captureView() {
	const active = document.activeElement;
	const focus = active && active !== document.body ? {
		draft: active.dataset?.draft, id: active.id,
		selection: typeof active.selectionStart === 'number' ? [active.selectionStart, active.selectionEnd, active.selectionDirection] : null,
		scroll: active.scrollTop,
	} : null;
	return { focus, open: new Set([...document.querySelectorAll('details[open][data-key]')].map((node) => node.dataset.key)), scroll: $('main').scrollTop };
}
function restoreView(view) {
	for (const node of document.querySelectorAll('details[data-key]')) if (view.open.has(node.dataset.key)) node.open = true;
	const { focus } = view;
	const target = focus && ((focus.draft && document.querySelector(`[data-draft="${CSS.escape(focus.draft)}"]`)) || (focus.id && $(focus.id)));
	if (target && target !== document.activeElement) {
		target.focus({ preventScroll: true });
		if (focus.selection && target.setSelectionRange) target.setSelectionRange(...focus.selection);
		target.scrollTop = focus.scroll;
	}
	$('main').scrollTop = view.scroll;
}

function render() {
	if (!state.sprint) return;
	reconcilePicks();
	for (const question of withSubmitQuestions()) choices[question.id] ??= question.options?.find((option) => option.recommended)?.id;
	syncView();
	const items = requestItems();
	const view = captureView();
	const stepBefore = state.signatures.stepKey;
	renderTop();
	renderStepper();
	renderContent();
	renderAsks();
	renderThreads(items);
	restoreView(view);
	if (stepBefore !== state.signatures.stepKey) $('main').scrollTop = 0;
	renderPresence(items);
	refreshPicks();
	renderDynamic();
	renderFooter();
	document.body.dataset.phase = state.phase;
	document.body.dataset.step = state.stepId ?? '';
}
function syncView() {
	const viewports = state.sprint.viewports?.length ? state.sprint.viewports : [390, 1280];
	if (!viewports.includes(state.viewport)) state.viewport = viewports.at(-1);
	const themes = state.sprint.themes ?? [];
	if (!themes.includes(state.theme)) state.theme = themes[0] ?? null;
	state.phase = phaseOf(state.sprint, state.feedback);
	if (state.phase !== 'choosing') { state.stepId = null; return; }
	const steps = currentSteps();
	const hash = hashId();
	const step = steps.find((item) => item.id === hash)
		?? (hash === 'waiting' ? steps.find((item) => item.kind === 'decision') ?? steps.find((item) => item.kind === 'review') : null)
		?? steps.find((item) => item.id === state.stepId)
		?? steps[0];
	state.stepId = step.id;
	if (hash !== step.id) history.replaceState(null, '', toHash(step.id));
}

function renderTop() {
	const sprint = state.sprint;
	const viewports = sprint.viewports?.length ? sprint.viewports : [390, 1280];
	const themes = sprint.themes ?? [];
	renderWhenChanged('top', [sprint.title, sprint.goal, sprint.round, viewports, themes, state.viewport, state.theme], () => {
		document.title = `${sprint.title || 'Design sprint'} · design sprint`;
		const theme = el('select', { id: 'theme' }, themes.map((name) => el('option', { value: name, textContent: name, selected: name === state.theme })));
		theme.addEventListener('change', () => { state.theme = theme.value; render(); });
		$('top').replaceChildren(
			el('h1', { textContent: sprint.title || 'Design sprint' }),
			el('span', { className: 'tag', textContent: `Round ${sprint.round ?? 1}` }),
			el('span', { className: 'spacer' }),
			el('div', { className: 'row', role: 'group', ariaLabel: 'Preview width' }, viewports.map((width) => el('button', {
				type: 'button', textContent: `${width}px`, ariaPressed: String(width === state.viewport), onclick: () => { state.viewport = width; render(); },
			}))),
			themes.length ? el('label', { className: 'row' }, ['Theme', theme]) : null,
			el('button', { type: 'button', id: 'copy', textContent: 'Copy answer', onclick: copyAnswer }),
		);
		$('goal').textContent = sprint.goal ?? '';
	});
}
function renderStepper() {
	const steps = currentSteps();
	const chips = steps.map((step, index) => {

async function sendReprompt(target) {
	const text = (drafts[target] ?? '').trim();
	if (!text) { $(domId(target))?.focus(); return; }
	if (!await post({ type: 'reprompt', target, text })) return;
	delete drafts[target];
	const area = $(domId(target));
	if (area) area.value = '';
	render();
}
async function sendAnswer(question, option) {
	const text = (drafts[`answer:${question.id}`] ?? '').trim();
	if (!option && !text) { $(domId(`answer:${question.id}`))?.focus(); setStatus('Pick an option or write an answer.'); return; }
	if (!await post({ type: 'answer', target: `question:${question.id}`, ...(option ? { option } : {}), ...(text ? { text } : {}) })) return;
	delete drafts[`answer:${question.id}`];
	render();
}
async function submitAll() {
	if (!canSubmit() || state.busy) return;
	state.busy = true;
	renderFooter();
	try {
		for (const step of currentSteps()) if (!await postPick(pickTarget(step))) return;
		const answers = {};
		for (const question of withSubmitQuestions()) {
			const text = (drafts[`answer:${question.id}`] ?? '').trim();
			const option = choices[question.id];
			answers[question.id] = { ...(option ? { option } : {}), ...(text ? { text } : {}) };
		}
		const note = (drafts.notes ?? '').trim();
		await post({ type: 'submit', text: answerText(), ...(note ? { option: note } : {}), ...(Object.keys(answers).length ? { answers } : {}) });
	} finally {
		state.busy = false;
		render();
	}
}
async function copyAnswer() {
	const submitted = state.feedback.findLast((event) => event.type === 'submit');
	const text = submitted ? [submitted.text, submitted.option].filter(Boolean).join('\nNote: ') : [answerText(), (drafts.notes ?? '').trim()].filter(Boolean).join('\nNote: ');
	try {
		await navigator.clipboard.writeText(text || 'nothing picked');
		setStatus('Copied.');
	} catch {
		setStatus('Copy failed. Select the answer and copy it.');
	}
}

async function poll() {
	if (state.stopped || state.polling) return;
	state.polling = true;
	try {
		const response = await fetch('/api/state', { cache: 'no-store' });
		if (!response.ok) throw new Error(`HTTP ${response.status}`);
		const data = await response.json();
		if (!state.sprint) {
			const config = await (await fetch('/api/config', { cache: 'no-store' })).json();
			state.filesOrigin = config.filesOrigin;
			state.sprintId = config.sprintId;
			state.maxText = config.maxText;
			state.sprint = data.sprint;
			Object.assign(picks, loadPicks());
			for (const event of data.feedback) {
				if (event.type !== 'pick') continue;
				picks[event.target] ??= event.option;
				sentPicks[event.target] = event.option;
			}
		}
		state.sprint = data.sprint;
		state.agent = data.agent;
		mergeKeepingLocal(data.feedback);
		$('offline').hidden = true;
		render();
		if (state.phase === 'done') { state.stopped = true; clearInterval(state.timer); }
	} catch {
		$('offline').hidden = state.phase === 'done';
	} finally {
		state.polling = false;
	}
}
document.addEventListener('input', (event) => {
	const key = event.target.dataset?.draft;
	if (!key) return;
	drafts[key] = event.target.value;
	renderFooter();
	renderDynamic();
});
window.addEventListener('popstate', () => {
	if (state.phase !== 'choosing') return;
	const step = currentSteps().find((item) => item.id === hashId());
	if (step && step.id !== state.stepId) {
		const leaving = currentStep();
		state.stepId = step.id;
		if (leaving) postPick(pickTarget(leaving));
		render();
	}
});
poll();
state.timer = setInterval(poll, 1000);
</script>
